name: Sync playlist to Yoto card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yoto-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Run sync
        id: sync
        env:
          YOTO_CLIENT_ID: ${{ secrets.YOTO_CLIENT_ID }}
          YOTO_REFRESH_TOKEN: ${{ secrets.YOTO_REFRESH_TOKEN }}
        run: python scripts/sync_to_yoto.py

      - name: Persist rotated refresh token
        if: always() && steps.sync.outputs.refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          YOTO_ROTATED_REFRESH_TOKEN: ${{ steps.sync.outputs.refresh_token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$YOTO_ROTATED_REFRESH_TOKEN" | gh secret set YOTO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Saving rotated refresh token failed; retrying (attempt $attempt/5)."
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Could not save rotated Yoto refresh token after 5 attempts. Reauthorization may be required."
          exit 1

      - name: Commit and push changes
        run: |
          git config user.name "yoto-podcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync new episodes"
            git push
          fi
